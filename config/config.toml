shortcut = "SUPER+SPACE"
theme = "dark"

# Allow-list of plugin ids. Registered plugins that are not listed here are
# skipped at startup; an empty list keeps every registered plugin active.
# "applications" is the native app search, "echo" is the example plugin,
# "calculator" evaluates arithmetic expressions inline, and "clipboard"
# keeps a searchable history of copied text (`clip:`).
enabled_plugins = [
    "applications",
    "echo",
    "calculator",
    "clipboard",
]

[appearance]
theme = "auto"
accent_color = "#0a84ff"
blur_enabled = true
corner_radius = 16
window_width = 640

[clipboard]
# How long copied text is remembered for `clip:` searching. "session" keeps
# the history memory-only (cleared when the daemon stops); "1_day", "1_week"
# or "1_month" persist it to disk and prune entries older than that.
retention = "1_week"